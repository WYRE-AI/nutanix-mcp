# Gateway mode. Prism Central credentials arrive per request on
# X-Nutanix-Pc-* headers. Do not set PC_HOST, PC_USERNAME, PC_PASSWORD,
# PC_API_KEY, or env_file here — that would put static vendor credentials
# in the container. The project .env is used only for Compose interpolation
# of CONDUIT_S2S_SECRET.
services:
  nutanix-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
