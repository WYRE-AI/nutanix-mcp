# Canonical Dependabot config for the WYRE-AI *-mcp / node-* fleet.
#
# Goal: keep PR volume manageable for a small team. Updates are GROUPED so a
# repo gets a handful of PRs per week instead of one-per-package, and the
# dependabot-janitor (daily) auto-merges the green grouped PRs. Only
# PRODUCTION-dependency MAJOR bumps land as individual PRs for human review,
# since those can carry behavioural breaking changes a green test suite misses.
#
# MIGRATED 2026-08-20 from this repo's original pre-06-21-centralization
# shape (bare npm/github-actions/docker blocks, no grouping at all, no
# typescript ignore rule) to the fleet-standard shape every other *-mcp repo
# already carries. Reusable release.yml's `verify` job (build/lint/test on
# push AND pull_request) already gates this repo's PRs, so grouped major
# auto-merge here is gated the same way it is fleet-wide.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # All dev/CI tooling (eslint, vitest, typescript, @types/*, etc.) incl.
      # majors → ONE PR. The janitor auto-merges it when CI is green.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      # Production minor + patch → ONE PR. Auto-merged when green.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Production MAJORS are intentionally NOT grouped → individual PRs, held for
    # human review (never auto-merged).
    ignore:
      # ip-address (GHSA, affects <=10.3.0) and undici (GHSA cookie-injection /
      # CRLF injection / response desync, affects <6.28.0) are both unreachable,
      # not unaddressed. Both are nested inside npm's OWN bundled dependency tree
      # (@semantic-release/npm -> npm@^11.x (bundled) -> ... -> ip-address@10.2.0
      # / undici@6.27.0), confirmed via package-lock.json (node_modules/npm/
      # node_modules/ip-address and node_modules/npm/node_modules/undici). This
      # repo's OTHER undici instances (@actions/http-client's copy at 6.28.0,
      # top-level at 7.29.0) are already patched -- only the npm-bundled ones are
      # vulnerable. Same shape verified via a package.json `overrides` test on
      # node-ninjaone (ip-address, 2026-08-06) and node-halopsa (undici,
      # 2026-08-25): the override has ZERO effect on npm's bundled copy. No
      # amount of top-level dependency management in THIS repo can reach either;
      # only a new `npm` release bundling patched versions closes this. Without
      # this ignore, Dependabot's security job retries and fails daily/weekly
      # trying to patch an unreachable nested copy -- a permanently-red
      # scheduled job trains everyone to stop looking at it, which could mask an
      # unrelated, actually-fixable advisory later.
      # The underlying GHSA alerts stay open/visible on the repo's Security >
      # Dependabot alerts tab regardless of this ignore -- this only stops the
      # doomed PR-open attempt, it does not dismiss the vulnerability.
      # Revisit: periodically confirm whether a newer npm bundles fixed versions
      # (check node_modules/npm/node_modules/<pkg>'s version after a fresh
      # install, or just remove this ignore and see if Dependabot succeeds).
      - dependency-name: "ip-address"
      - dependency-name: "undici"
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # The runtime stage MUST stay on the same python minor as the uv build
      # stage (python3.12): the venv's bin/python symlinks to
      # /usr/local/bin/python3.12, so a runtime base bump to a newer python
      # leaves it dangling and the image fails its build-time smoke test
      # (exit 127). Bump BOTH stages together, manually. Broke main via #8.
      - dependency-name: "python"
